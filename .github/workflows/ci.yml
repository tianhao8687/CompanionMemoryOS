name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,browser]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy companion_memoryos companion_agent
      - run: pytest --cov=companion_memoryos --cov=companion_agent --cov-report=term-missing

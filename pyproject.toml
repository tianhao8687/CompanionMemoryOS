[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "companion-memoryos"
version = "0.7.5"
description = "Local-first, consent-first memory infrastructure for emotional companion applications"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "tianhao8687" }]
keywords = ["memory", "companion", "privacy", "sqlite", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<1",
  "mcp>=1.30,<2",
  "jsonschema>=4.23,<5",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "tiktoken>=0.9,<1",
  "typer>=0.15,<1",
  "tzdata>=2025.1; sys_platform == 'win32'",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff==0.16.7",
  "types-PyYAML>=6,<7",
  "types-jsonschema>=4.23",
]

[project.scripts]
companion-memoryos = "companion_memoryos.cli:main"
companion-agent = "companion_agent.cli:main"
companion-romance = "companion_agent.app:main"
companion-phone-mcp = "companion_agent.integrations.phone:main"

[tool.hatch.build.targets.wheel]
packages = ["companion_memoryos", "companion_agent"]

[tool.hatch.build.targets.sdist]
include = ["companion_memoryos", "companion_agent", "tests", "docs", "examples", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["companion_memoryos", "companion_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

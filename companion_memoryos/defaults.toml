schema_version = "1.0"

[server]
host = "127.0.0.1"
port = 8765

[database]
busy_timeout_ms = 5000

[security]
token_bytes = 32

[retention]
ephemeral_hours = 24
short_term_days = 30
long_term_days = 365
sensitive_max_days = 30
candidate_review_days = 14

[retrieval]
candidate_pool = 80
semantic_candidate_pool = 40
event_candidate_pool = 40
default_limit = 8
max_limit = 25
default_event_limit = 3
max_event_limit = 8
turn_candidate_pool = 80
default_turn_limit = 4
max_turn_limit = 12
default_max_characters = 6000
max_characters = 20000
default_max_tokens = 1200
max_tokens = 8000
recency_half_life_days = 60.0
cjk_ngram_min = 1
cjk_ngram_max = 3
minimum_token_length = 2
max_fts_terms = 32
max_index_terms = 4096
minimum_natural_query_characters = 2
minimum_query_match = 0.08
minimum_semantic_similarity = 0.20
ambiguity_score_gap = 0.05
confidence_hedge_threshold = 0.25
confidence_natural_threshold = 0.60

[ranking]
lexical = 0.24
semantic = 0.20
entity = 0.10
temporal = 0.10
salience = 0.10
recency = 0.08
emotion = 0.07
need = 0.05
continuity = 0.06

[policy]
sensitive_requires_explicit_consent = true
highly_sensitive_requires_review = true
unknown_sensitive_is_discarded = true
wellbeing_signals_are_ephemeral = true
exact_duplicate_detection = true

[tokenization]
encoding = "cl100k_base"

# Single-call interpreter. These are prototype resource budgets, not learned thresholds.
[interpreter]
enabled = false
api_key_env = "COMPANION_INTERPRETER_API_KEY"
require_api_key = true
timeout_seconds = 30.0
max_input_tokens = 4096
max_output_tokens = 1536
max_response_bytes = 262144
recent_turn_limit = 6
entity_candidate_limit = 24
episode_candidate_limit = 6
instruction_role = "system"
output_token_parameter = "max_completion_tokens"
json_mode = true
skip_exact_directives = true

[event_archive]
enabled = true
require_granted_consent = true
allow_assistant_events = false
allow_highly_sensitive = false
require_scoped_recall = true
retention_days = 180
sensitive_retention_days = 30

[temporal_anchors]
enabled = true
minimum_match_characters = 2
max_matches = 4
allow_sensitive = false

[conversation_ledger]
enabled = true
require_granted_consent = true
allow_assistant_turns = true
allow_highly_sensitive = false
require_scoped_recall = true

[epistemic]
weak_confirmation_requires_review = true
ineligible_self_report_becomes_observation = true

[memory_use_ledger]
enabled = true

[open_loops]
enabled = true
require_granted_consent = true
allow_highly_sensitive = false

[experience]
enabled = true
default_cancel_on_new_user_turn = true
avoid_repeat_within_conversation = true
semantic_beats_enabled_by_default = true
afterthought_enabled_by_default = false

[discourse]
listen_only_phrases = ["先听我说", "听我说完", "别给建议", "不用分析", "先别分析"]
advice_request_phrases = ["给我建议", "你觉得怎么办", "我该怎么办", "帮我想办法"]
memory_question_phrases = ["你还记得", "你记得吗", "我以前说过", "上次那个", "之前那件事"]
wrong_reference_phrases = ["不是那个", "不是这件", "你记错了", "你串了", "不是我说的"]
stop_referencing_phrases = ["以后别提", "别再提", "不要再提", "别再拿这件事说"]
topic_switch_phrases = ["换个话题", "先不说这个", "算了不说了", "这个先放一放"]
outcome_reported_phrases = ["已经结束了", "已经考完了", "考完了", "已经通过了", "最后没去", "后来没去"]

[policy_engine]
enabled = true
default_allow = true

[policy_bundle]
profile_id = "relationship-memory-zh-prototype"
profile_version = "0.7.5-alpha"
operating_point = "false-attribution-averse"
calibrated = false
production_eligible = false
model_fingerprints = []

[proactivity]
enabled_by_default = false
minimum_idle_minutes = 240
cooldown_minutes = 720
maximum_outreaches_per_day = 2
negative_signal_quiet_hours = 24
require_relevant_reason = true

[continuity.general]
identity = 0.85
preference = 0.85
boundary = 1.00
support_strategy = 0.95
commitment = 0.75
ritual = 0.70
emotion_episode = 0.65

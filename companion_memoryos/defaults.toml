schema_version = "1.0"

[server]
host = "127.0.0.1"
port = 8765

[database]
busy_timeout_ms = 5000

[security]
token_bytes = 32

[retention]
ephemeral_hours = 24
short_term_days = 30
long_term_days = 365
sensitive_max_days = 30
candidate_review_days = 14

[retrieval]
candidate_pool = 80
default_limit = 8
max_limit = 25
default_max_characters = 6000
max_characters = 20000
recency_half_life_days = 60.0
cjk_ngram_min = 2
cjk_ngram_max = 3
minimum_token_length = 2
max_fts_terms = 32

[ranking]
lexical = 0.32
salience = 0.20
recency = 0.16
emotion = 0.12
need = 0.10
continuity = 0.10

[policy]
sensitive_requires_explicit_consent = true
highly_sensitive_requires_review = true
unknown_sensitive_is_discarded = true
wellbeing_signals_are_ephemeral = true
exact_duplicate_detection = true

